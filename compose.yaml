name: web-ssh

services:
  web-ssh:
    build: .
    init: true
    restart: unless-stopped
    environment:
      APP_URL: https://ssh.dev.example.com
      CA_NAME: "Mac SSH CA"
      OIDC_ISSUER: https://id.dev.example.com
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      TRUSTED_PROXIES: 172.30.0.2,100.64.0.2   # VPS ingress, edge Traefik (over VPN)
    secrets: [ca_password]
    volumes: ["./data:/data"]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    labels:
      traefik.enable: "true"
      traefik.http.routers.webssh.rule: Host(`ssh.dev.example.com`)
      traefik.http.services.webssh.loadbalancer.server.port: "3000"
    networks: [ingress]

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2@sha256:323e7ef5bfacf7cf32f22f3d10ccdf48e0c97c94d67e7e40b0b996830deb5165
    restart: unless-stopped
    environment:
      APP_URL: https://id.dev.example.com
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY}
    volumes: ["./pocket-id:/app/data"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.pocketid.rule: Host(`id.dev.example.com`)
      traefik.http.services.pocketid.loadbalancer.server.port: "1411"
    networks: [ingress]

  ssh-target:
    build: apps/api/test/ssh-target
    restart: unless-stopped
    volumes: ["ssh-target-etc:/etc/ssh"]   # keeps host keys + enrollment across rebuilds
    networks: [ingress]

  ingress:
    image: traefik:v3.7@sha256:b588cb566045e1ebb185948a8e2456f9705cb915b5f0fb5ee698184233997817
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedHeaders.trustedIPs=100.64.0.2
    ports: ["${MGMT_IP}:80:80"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks:
      ingress: { ipv4_address: 172.30.0.2 }

secrets:
  ca_password: { file: ./secrets/ca_password }

volumes:
  ssh-target-etc: {}

networks:
  ingress:
    ipam: { config: [{ subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25 }] }
