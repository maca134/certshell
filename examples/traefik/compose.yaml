# CertShell + Pocket ID behind Traefik (Let's Encrypt). Setup steps: README.md → Quick start.
name: certshell

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    environment:
      SSH_DOMAIN: ${SSH_DOMAIN}
      ID_DOMAIN: ${ID_DOMAIN}
    command:
      - --providers.file.filename=/etc/traefik/routes.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports: ["80:80", "443:443"]
    volumes:
      - ./routes.yml:/etc/traefik/routes.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      default:
        ipv4_address: 172.31.0.2   # = certshell TRUSTED_PROXIES
        aliases: ["${ID_DOMAIN}"]   # certshell reaches Pocket ID without hairpin NAT

  certshell:
    image: ghcr.io/maca134/certshell:1
    init: true
    restart: unless-stopped
    environment:
      APP_URL: https://${SSH_DOMAIN}
      OIDC_ISSUER: https://${ID_DOMAIN}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      TRUSTED_PROXIES: 172.31.0.2
    secrets: [ca_password]
    volumes: ["certshell-data:/data"]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    environment:
      APP_URL: https://${ID_DOMAIN}
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY}
    volumes: ["pocket-id-data:/app/data"]

secrets:
  ca_password: { file: ./secrets/ca_password }

volumes:
  letsencrypt: {}
  certshell-data: {}
  pocket-id-data: {}

networks:
  default:
    ipam: { config: [{ subnet: 172.31.0.0/24, ip_range: 172.31.0.128/25 }] }
