# Dev overlay: Vite with HMR + API with bun --watch, both on bind-mounted source.
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
# https://$SSH_DOMAIN → Traefik → web-dev (Vite) → /api, /auth → web-ssh
services:
  web-ssh:
    entrypoint: ["bun", "--watch", "apps/api/src/main.ts"]
    environment:
      TRUSTED_PROXIES: 172.30.0.2,${UPSTREAM_PROXY},172.30.0.3   # + web-dev
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages/shared/src:/app/packages/shared/src:ro
    labels:
      traefik.enable: "false"

  web-dev:
    image: oven/bun:1-debian
    working_dir: /app/apps/web
    command: ["bun", "run", "dev"]
    environment:
      API_URL: http://web-ssh:3000
      DEV_PUBLIC_HOST: ${SSH_DOMAIN}
    volumes:
      - ./apps/web:/app/apps/web   # rw: Vite writes its cache to apps/web/node_modules/.vite
      - ./packages:/app/packages:ro
      - ./node_modules:/app/node_modules:ro
      - ./bun.lock:/app/bun.lock:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.webdev.rule: Host(`${SSH_DOMAIN}`)
      traefik.http.services.webdev.loadbalancer.server.port: "5173"
    networks:
      ingress: { ipv4_address: 172.30.0.3 }
