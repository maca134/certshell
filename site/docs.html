<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CertShell docs — Install, configure, add hosts</title>
        <meta name="description" content="How to install CertShell, connect your OIDC provider, enroll hosts, map IdP groups to logins and run tasks. Configuration, security model and backups." />
        <link rel="canonical" href="https://certshell.dev/docs" />
        <meta name="theme-color" content="#0b1220" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="CertShell" />
        <meta property="og:title" content="CertShell docs — Install, configure, add hosts" />
        <meta property="og:description" content="How to install CertShell, connect your OIDC provider, enroll hosts, map IdP groups to logins and run tasks. Configuration, security model and backups." />
        <meta property="og:url" content="https://certshell.dev/docs" />
        <meta property="og:image" content="https://certshell.dev/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="CertShell: SSH from your browser. No keys to manage." />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" href="favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <div class="wrap">
                <a class="brand" href="/"><img src="favicon.svg" alt="" width="28" height="28" />CertShell</a>
                <nav>
                    <a href="/setup">Setup</a>
                    <a href="/docs">Docs</a>
                    <a href="https://github.com/maca134/certshell">GitHub</a>
                </nav>
            </div>
        </header>

        <main class="wrap docs">
            <aside id="toc"></aside>
            <article id="doc">Loading…</article>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
        <script type="module">
            import { highlight } from "./highlight.js";

            // README.md and pocket-id.md are copied next to this page by .github/workflows/site.yml
            const repo = "https://github.com/maca134/certshell/blob/main/";
            Promise.all(["README.md", "pocket-id.md"].map((f) => fetch(f).then((r) => r.text())))
                .then(([readme, pocketId]) => {
                    // The walkthrough goes in as a section right after the part of README that links to it.
                    const at = readme.indexOf("\n## ", readme.indexOf("(docs/pocket-id.md)"));
                    const md = `${readme.slice(0, at)}\n\n${pocketId.replace(/^# /, "## ")}${readme.slice(at)}`;
                    const doc = document.getElementById("doc");
                    doc.innerHTML = marked.parse(md.replace(/^<img[^>]*>\s*/, ""));
                    for (const a of doc.querySelectorAll("a[href]")) {
                        const href = a.getAttribute("href").replace(/^(\.\.\/)?README\.md#/, "#").replace("docs/pocket-id.md", "#pocket-id-walkthrough");
                        if (!/^(https?:|#|mailto:)/.test(href)) a.href = repo + href;
                        else a.setAttribute("href", href);
                    }
                    for (const code of doc.querySelectorAll("pre code")) code.innerHTML = highlight(code.textContent, code.className.replace("language-", ""));
                    const toc = document.getElementById("toc");
                    for (const h of doc.querySelectorAll("h2")) {
                        h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
                        toc.insertAdjacentHTML("beforeend", `<a href="#${h.id}">${h.textContent}</a>`);
                    }
                    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
                });
        </script>
    </body>
</html>
